<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="both.css">
</head>
<body>
    <div class="main-container">
        <section class="header">
              
            <div style=" display: flex; justify-content: space-between; align-items: center;">
               <table>
                   <tr>
                    <td>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" style="width: 25px; height:25px; color: rgb(118, 101, 226);">
                           <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                        </svg>
                    </td>
                    <td><b><span> Image <span style="color: rgb(118, 101, 226);"> Gallery </span> </span></b></td>
                   </tr>
               </table>
            </div>

            <div class="nav">
               <div class="one" id="home"><a href="index.html" style="text-decoration: none; color: black;"> Home </a></div>
               <div id="about"><a href="about.html" style="text-decoration: none; color:black;"> About</a></div>

               <!-- Dark mode toggle: added -->
               <label class="theme-toggle">
                   <input type="checkbox" id="theme-switch">
                   <span class="toggle-track">
                       <span class="toggle-thumb">
                           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="11" height="11">
                               <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                           </svg>
                       </span>
                   </span>
               </label>
               <!-- Dark mode toggle end -->

            </div>

        </section>
        <br>
        <section class="hero">

           
            <div class="hero-inner">
                <div class="hero-images">
                    <img src="asset/pexels-anh-nguyen-87266688-14486504.jpg" alt="Blue glacier lake in the mountains" class="hero-img img-1">
                    <img src="asset/pexels-selman-arif-golbasi-322737964-13921909.jpg" alt="Mountain peak wrapped in clouds" class="hero-img img-2">
                    <img src="asset/pexels-turbulent-imagery-3013266-7433714.jpg" alt="Purple sunset over mountain ridge" class="hero-img img-3">
                </div>
                <div class="hero-text">
                    <h1 style="margin: 1px; padding: 5px;">Image <span style="color: rgb(118, 102, 219);">Gallery</span></h1>
                    <p style="margin: 1px; padding: 5px; color: rgb(120, 121, 122); font-size: medium;">Explore high quality image using fetch API</p>
                    <div class="hero-pills">
                        <span class="pill">✨ High Quality</span>
                        <span class="pill">⚡ Fast &amp; Reliable</span>
                        <span class="pill">💕 Free to Use</span>
                    </div>
                </div>
            </div>
           

        </section>
        
        <br>
        <section class="controls">
            <input class="search-bar" type="search" placeholder=" 🔍 search image">

            <div class="search-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" width="15px" height="15px">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>

            <div>
                <select name="category" id="" class="categorys">
                    <option value="all">All category</option>
                    <option value="nature">Nature</option>
                    <option value="animal">Animal</option>
                    <option value="technology">Technology</option>
                </select>
            </div>

            <div class="refresh-btn">
                <table>
                    <tr>
                        <td>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" style="width: 20px; height:20px;">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3" />
                            </svg>
                       </td>
                       <td>
                          <span>Refresh</span>
                       </td>
                    </tr>
                </table> 
            </div>
        </section>

        <section class="grid">
              
        </section>

        <br>
        <br>

        <section class="footer">
            <div class="load-more-btn"> Load more </div>
            <div class="img-counter"> Streaming 12 out of 120+ images</div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="both.js"></script>
</body>
</html>
